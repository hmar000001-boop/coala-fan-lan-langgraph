name: Build LaTeX to PDF

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create output directory and index links
        run: |
          mkdir -p Tex/Output
          ln -sfn Tex/Output/main.idx main.idx
          ln -sfn Tex/Output/main.ind main.ind

      - name: Check repository structure
        run: bash scripts/check-scaffold.sh

      - name: Compile LaTeX (XeLaTeX via latexmk)
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          run: |
            latexmk \
              -xelatex \
              -halt-on-error \
              -file-line-error \
              -interaction=nonstopmode \
              -output-directory=Tex/Output \
              Tex/main.tex

            makeglossaries -d Tex/Output main
            if [ -s Tex/Output/main.idx ]; then
              makeindex -o Tex/Output/main.ind Tex/Output/main.idx
            fi

            latexmk \
              -xelatex \
              -halt-on-error \
              -file-line-error \
              -interaction=nonstopmode \
              -output-directory=Tex/Output \
              Tex/main.tex

            cp Tex/Output/main.pdf Tex/Output/book.pdf

      - name: Install PDF validation utilities
        run: |
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
          pdfinfo -v
          pdftotext -v

      - name: Validate generated PDF and LaTeX log
        run: bash scripts/quality-checks.sh Tex/Output/main.pdf Tex/Output/main.log

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: Tex/Output/book.pdf
          if-no-files-found: error

  release:
    name: Publish tagged PDF release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the validated PDF
        uses: actions/download-artifact@v4
        with:
          name: compiled-pdf
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/book.pdf \
            --title "$TAG_NAME" \
            --generate-notes \
            --verify-tag
