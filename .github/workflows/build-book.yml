name: Build LaTeX to PDF

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p build

      - name: Verify repository placeholders
        run: bash scripts/check-scaffold.sh

      - name: Compile LaTeX (XeLaTeX via latexmk)
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          run: |
            latexmk \
              -xelatex \
              -halt-on-error \
              -file-line-error \
              -interaction=nonstopmode \
              -output-directory=build \
              main.tex

            # Run glossary and index generators when the source has entries.
            if [ -f build/main.glo ]; then
              makeglossaries -d build main
            fi
            if [ -f build/main.idx ]; then
              makeindex -o build/main.ind build/main.idx
            fi

            # Resolve any generated glossary/index files and finish the PDF.
            latexmk \
              -xelatex \
              -halt-on-error \
              -file-line-error \
              -interaction=nonstopmode \
              -output-directory=build \
              main.tex

            cp build/main.pdf build/book.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: build/book.pdf
          if-no-files-found: error

  release:
    name: Publish tagged PDF release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the validated PDF
        uses: actions/download-artifact@v4
        with:
          name: compiled-pdf
          path: build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" build/book.pdf \
            --title "$TAG_NAME" \
            --generate-notes \
            --verify-tag
