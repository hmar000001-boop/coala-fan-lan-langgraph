name: Build book PDF

on:
  push:

permissions:
  contents: read

concurrency:
  group: book-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate combined book
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set reproducible build timestamp from commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Install latest TeX Live
        run: sudo bash scripts/install-texlive.sh

      - name: Add TeX Live to PATH
        run: echo "/opt/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Verify placeholder structure
        run: bash scripts/check-scaffold.sh

      - name: Render Mermaid diagrams (when present)
        run: bash scripts/render-diagrams.sh

      - name: Spell check source and documentation
        run: |
          npx --yes cspell@latest --config cspell.json --no-progress \
            "**/*.md" "**/*.tex" "**/*.bib" "**/*.yml" "**/*.yaml"

      - name: Build combined book
        run: bash scripts/build-book.sh

      - name: Run PDF and source quality gates
        run: bash scripts/quality-checks.sh

      - name: Retain validated PDF for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-book-pdf
          path: build/book.pdf
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish tagged PDF release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the validated book PDF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-book-pdf
          path: build

      - name: Create or update GitHub Release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" build/book.pdf --clobber
          else
            gh release create "$TAG_NAME" build/book.pdf \
              --title "$TAG_NAME" \
              --generate-notes --verify-tag
          fi
